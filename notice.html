<!DOCTYPE html>
<html>
<head>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
</head>
<body>

<div id="view"></div>
<button id="delBtn" onclick="del()" style="display:none;">삭제</button>

<script>
const id = new URLSearchParams(location.search).get("id");

db.collection("notices").doc(id).get().then(doc=>{
  const d = doc.data();
  view.innerHTML = `<h2>${d.title}</h2><p>${d.content}</p>`;
});

auth.onAuthStateChanged(user=>{
  if(user) delBtn.style.display="block";
});

function del(){
  db.collection("notices").doc(id).delete().then(()=>{
    alert("삭제됨");
    location.href="index.html";
  });
}
</script>

</body>
</html>
