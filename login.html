<!DOCTYPE html>
<html>
<body>

<h2>관리자 로그인 (테스트)</h2>

<input id="id" placeholder="아이디"><br>
<input id="pw" type="password" placeholder="비밀번호"><br>

<button onclick="login()">로그인</button>

<script>
function login(){
  if(id.value === "admin" && pw.value === "1234"){
    location.href="admin.html";
  } else {
    alert("로그인 실패");
  }
}
</script>

</body>
</html>
